version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # chat and its adapters are pinned to the same exact version and are wired
      # together in bot/src/lib/bot.ts. Bumping one alone puts two copies of
      # `chat` in the tree and the typecheck fails on mismatched message types,
      # so they have to move in one PR.
      chat-sdk:
        patterns:
          - "chat"
          - "@chat-adapter/*"

    ignore:
      # @chat-adapter/state-redis depends on redis ^5.11.0. A major bump here
      # does not replace redis 5 in the tree, it adds redis 6 alongside it, so
      # bot/src/app/api/health/route.ts would ping a different client than the
      # state adapter actually uses. The typecheck passes, so CI cannot catch
      # it. Drop this once state-redis supports redis 6.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
